<title>Benchline Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar + tab strip; each view is a full-width work surface. Board scrolls sideways inside its own track. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#16202b; --muted:#5a6675; --line:#dbe1e8;
  --accent:#2a4fd6; --accent-ink:#ffffff; --accent-soft:#e5ebfc;
  --warn:#9a5b00; --warn-bg:#fcefd6; --bad:#b4302a; --bad-bg:#fbe4e1; --good:#1d7349; --good-bg:#dff1e7;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d26; --sunk:#111821; --ink:#e6ebf1; --muted:#96a2b0; --line:#28323e;
  --accent:#87a3ff; --accent-ink:#0e131a; --accent-soft:#1d2846;
  --warn:#f2b55c; --warn-bg:#352812; --bad:#ff8e84; --bad-bg:#3a1c1a; --good:#72d4a2; --good-bg:#142d20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d26; --sunk:#111821; --ink:#e6ebf1; --muted:#96a2b0; --line:#28323e;
  --accent:#87a3ff; --accent-ink:#0e131a; --accent-soft:#1d2846;
  --warn:#f2b55c; --warn-bg:#352812; --bad:#ff8e84; --bad-bg:#3a1c1a; --good:#72d4a2; --good-bg:#142d20; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;flex:none}
.brand b{font-family:var(--display);font-size:1.2rem}
.brand .lab{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}

main{padding-block:20px 60px;max-width:1400px;margin:0 auto}
.viewhead{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.viewhead .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.shade{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.78rem}
.shade i{width:11px;height:14px;border-radius:3px 3px 5px 5px;border:1px solid var(--line);display:inline-block}

/* brief strip */
.brief{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 16px;margin-bottom:16px}
.brief .stat b{font-family:var(--display);font-size:1.4rem;margin-right:6px}
.brief .stat{color:var(--muted);font-size:.88rem}
.brief .note{flex-basis:100%;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* board */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:200px}
.col h3{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin:2px 4px 10px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;position:relative}
.card:hover{border-color:var(--accent)}
.card.overdue{box-shadow:inset 3px 0 0 var(--bad)}
.card.today{box-shadow:inset 3px 0 0 var(--warn)}
.card .no{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.card .what{font-weight:600;margin:2px 0}
.card .who{font-size:.82rem;color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field.found input,.field.found select{border-color:var(--good);background:var(--good-bg)}
textarea{resize:vertical}
.rx{min-height:190px;font-family:var(--mono);font-size:.85rem;line-height:1.55}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td input{width:5.5em;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;text-align:right}

/* stage tracker */
.track{display:flex;gap:4px;margin:10px 0}
.track span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track span.done{background:var(--accent)}
.track span.now{background:var(--accent);opacity:.45}
.tracklabels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-family:var(--mono)}

/* bench */
.techs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.techs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.88rem}
.techs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phone{max-width:430px;border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:18px;margin:0 auto}
.phone .head{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.phone .head small{opacity:.7;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.phone .head h3{font-size:1.25rem;margin-top:2px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qlist{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px}
.kpi b{display:block;font-family:var(--display);font-size:1.3rem}
.kpi span{font-size:.78rem;color:var(--muted)}

/* portal */
.portalhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:16px;margin-bottom:16px}
.portalhead h2{color:var(--accent)}
.pcase{padding:12px 0;border-bottom:1px solid var(--line)}
.pcase:last-child{border-bottom:0}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg .x{position:absolute;right:12px;top:12px}
.sect{border-top:1px solid var(--line);padding-top:12px}
.sect h4{margin:0 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;font-size:.86rem}
.timeline li{display:flex;gap:10px;padding:4px 0}
.timeline li .d{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:7.5em;flex:none}
pre.doc{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:14px;font-family:var(--mono);font-size:.78rem;line-height:1.55;margin:0;max-height:320px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}
.empty{color:var(--muted);font-size:.88rem;padding:10px 4px}
@media (prefers-reduced-motion: no-preference){.card,.btn{transition:border-color .12s,background .12s}}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="4" width="24" height="5" rx="2" fill="var(--accent)"/><rect x="2" y="11.5" width="17" height="5" rx="2" fill="var(--ink)"/><rect x="2" y="19" width="10" height="5" rx="2" fill="var(--muted)"/></svg>
      <b>Benchline</b><span class="lab" id="labname"></span>
    </div>
    <span class="sp"></span>
    <button class="iconbtn" data-act="settings">Lab settings</button>
  </div>
  <nav class="tabs wrap" id="tabs">
    <a href="#board">Cases</a><a href="#intake">Rx intake</a><a href="#bench">Bench</a><a href="#portal">Dentist portal</a><a href="#billing">Billing</a>
  </nav>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtShort=s=>new Date(s+'T00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'});
const money=n=>(+n||0).toLocaleString('en-AU',{style:'currency',currency:'AUD'});
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- domain ---------- */
const STAGES=['Received','Design','Milling','Finishing','QC','Dispatched'];
const PIECE={1:14,2:5,3:24,4:4};             // $ per unit credited when a stage is closed
const STATION={0:'t4',1:'t1',2:'t2',3:'t3',4:'t4'}; // default owner per stage
const SHADES={A1:'#f2e9d4',A2:'#eddcbc',A3:'#e5cfa6','A3.5':'#dcc195',A4:'#cfb084',B1:'#f4ecd8',B2:'#eee0bf',B3:'#e3cd9f',C1:'#e4dbc5',C2:'#d9cdb0',C3:'#cdbf9f',D2:'#e3d6c0',D3:'#d8c8ac',BL1:'#faf7f0',BL2:'#f7f2e8'};
const CATALOG={
  'zr-crown':{name:'Zirconia crown',unit:'tooth',price:260,mat:'Monolithic zirconia'},
  'emax-crown':{name:'IPS e.max crown',unit:'tooth',price:310,mat:'Lithium disilicate'},
  'pfm-crown':{name:'PFM crown',unit:'tooth',price:285,mat:'Porcelain fused to non-precious alloy'},
  'gold-crown':{name:'Full gold crown',unit:'tooth',price:680,mat:'Type III gold alloy'},
  'impl-crown':{name:'Implant crown, screw-retained',unit:'tooth',price:540,mat:'Zirconia on titanium base'},
  'zr-bridge':{name:'Zirconia bridge',unit:'unit',price:250,mat:'Monolithic zirconia'},
  'inlay':{name:'Inlay / onlay',unit:'tooth',price:240,mat:'Lithium disilicate'},
  'veneer':{name:'Veneer',unit:'tooth',price:330,mat:'Feldspathic porcelain'},
  'full-denture':{name:'Full denture',unit:'arch',price:760,mat:'Heat-cured acrylic, acrylic teeth'},
  'partial':{name:'Cobalt-chrome partial',unit:'arch',price:690,mat:'Cobalt-chromium framework, acrylic'},
  'splint':{name:'Occlusal splint',unit:'arch',price:190,mat:'Hard heat-cured acrylic'}
};
const units=it=>CATALOG[it.code].unit==='arch'?1:Math.max(1,it.teeth.length);

/* ---------- state ---------- */
const KEY='benchline-demo-v1';
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}

function seed(){
  const st={
    lab:{name:'Your Dental Lab',abn:'00 000 000 000',addr:'Unit 4, 12 Example St, Brisbane QLD 4000',acct:'200'},
    practices:[
      {id:'p1',name:'Harbourside Dental',suburb:'Neutral Bay NSW',email:'accounts@harbourside.example',dentists:['Dr Priya Raman','Dr Tom Ellery'],disc:0},
      {id:'p2',name:'Ashgrove Family Dental',suburb:'Ashgrove QLD',email:'admin@ashgrovefd.example',dentists:['Dr Mei Lin'],disc:5},
      {id:'p3',name:'Swan Street Smiles',suburb:'Richmond VIC',email:'reception@swanst.example',dentists:['Dr Josh Baird','Dr Ana Ruiz'],disc:0},
      {id:'p4',name:'Coastline Dental Group',suburb:'Wollongong NSW',email:'lab@coastline.example',dentists:['Dr Sam Okafor'],disc:8}
    ],
    techs:[
      {id:'t1',name:'Dana Whitfield',role:'CAD design'},
      {id:'t2',name:'Marco Pellegrini',role:'Milling'},
      {id:'t3',name:'Hannah Cho',role:'Ceramist'},
      {id:'t4',name:'Luke Tran',role:'Receiving, QC & dispatch'}
    ],
    cases:[],invoices:[],pay:[],clock:[],seq:241,inv:2051
  };
  // practice, dentist, patient, code, teeth, shade, stage, receivedAgo, dueIn, extra
  const rows=[
    ['p1',0,'J. Nguyen','zr-crown',[36],'A2',0,0,6],
    ['p3',1,'M. Kowalski','zr-bridge',[24,25,26],'A3',0,0,8],
    ['p2',0,'R. Singh','emax-crown',[11,21],'B1',1,1,0,{rush:1}],
    ['p4',0,'L. Harris','impl-crown',[46],'A3',1,2,4],
    ['p1',1,'S. Patel','veneer',[12,11,21,22],'BL2',1,4,5],
    ['p3',0,'K. Murphy','zr-crown',[16],'A3.5',2,5,1,{stuck:1}],
    ['p2',0,'D. Chen','inlay',[37],'A2',2,3,2],
    ['p4',0,'A. Rossi','zr-bridge',[44,45,46],'A3',2,5,-1],
    ['p1',0,'T. Brown','emax-crown',[14],'A1',3,4,0],
    ['p3',1,'G. Wilson','pfm-crown',[27],'A3',3,6,1],
    ['p4',0,'H. Ali','full-denture',[],'A2',3,8,3,{note:'Upper full denture, try-in approved'}],
    ['p2',0,'E. Taylor','splint',[],'',4,3,0,{note:'Upper hard splint, 2mm'}],
    ['p1',0,'C. Lee','zr-crown',[46],'A2',4,5,1],
    ['p3',0,'B. Martin','gold-crown',[17],'',5,9,-2],
    ['p1',1,'N. Walker','zr-crown',[26],'A3',5,8,-1],
    ['p4',0,'F. Young','emax-crown',[22],'A2',5,7,-1,{remake:1,note:'Remake: contact light on mesial'}],
    ['p2',0,'P. Scott','partial',[],'',5,12,-3,{note:'Lower Co-Cr partial replacing 35 36 46'}],
  ];
  for(const r of rows){
    const [pid,di,pt,code,teeth,shade,stage,ago,due,x={}]=r;
    const p=st.practices.find(p=>p.id===pid);
    const recv=addDays(TODAY,-ago);
    const c={id:uid(),no:'C-'+TODAY.slice(2,4)+'-'+String(st.seq++).padStart(4,'0'),practiceId:pid,dentist:p.dentists[di],patient:pt,
      items:[{code,teeth,shade}],stage,received:recv,due:addDays(TODAY,due),rush:!!x.rush,remake:!!x.remake,notes:x.note||'',
      assigned:{},history:[{d:recv,stage:0,who:'Luke Tran',txt:'Case received — Rx and impressions/scan logged'}],invoiced:false,source:'email'};
    for(let s=1;s<=stage;s++){
      let d=x.stuck?addDays(recv,1):addDays(TODAY,-(stage-s));if(d<recv)d=recv;
      c.history.push({d,stage:s,who:st.techs.find(t=>t.id===STATION[s-1]).name,txt:'Moved to '+STAGES[s]});
    }
    st.cases.push(c);
  }
  // past invoices for aging
  const past=[['p1',12,1840,false],['p2',41,965,false],['p3',18,2310,false],['p4',72,1460,false],['p3',95,620,false],['p1',44,2120,true],['p4',27,880,true]];
  for(const [pid,ago,amt,paid] of past){
    const d=addDays(TODAY,-ago);
    st.invoices.push({id:uid(),no:'INV-'+(st.inv++),practiceId:pid,date:d,due:addDays(d,30),paid,paidDate:paid?addDays(d,20):null,
      lines:[{desc:'Restorative work — statement period ending '+fmtShort(d),qty:1,unit:amt}]});
  }
  // some piece pay this week
  const wk=[['t1',1,3],['t2',2,4],['t3',3,2],['t4',4,5],['t3',3,3],['t1',1,2]];
  wk.forEach(([t,s,u],i)=>st.pay.push({techId:t,stage:s,units:u,rate:PIECE[s],amount:u*PIECE[s],date:addDays(TODAY,-(i%3)),caseNo:'—'}));
  return st;
}
S=load();

const prac=id=>S.practices.find(p=>p.id===id);
const tech=id=>S.techs.find(t=>t.id===id);
const caseById=id=>S.cases.find(c=>c.id===id);
const owner=c=>c.assigned[c.stage]||STATION[c.stage];
const lastMove=c=>c.history[c.history.length-1].d;
function priceFor(c,it){const p=prac(c.practiceId);const base=CATALOG[it.code].price*(1-(p.disc||0)/100);return c.remake?0:Math.round(base*100)/100}
function caseTotal(c){return c.items.reduce((s,it)=>s+priceFor(c,it)*units(it),0)}
function dueState(c){if(c.stage===5)return 'done';const d=diff(c.due,TODAY);return d<0?'overdue':d===0?'today':'ok'}
function itemLabel(it){const k=CATALOG[it.code];const n=units(it);return (k.unit==='unit'?n+'-unit ':'')+k.name+(it.teeth.length&&k.unit!=='unit'&&n>1?' ×'+n:'')}
const teethTxt=it=>it.teeth.length?it.teeth.join(' · '):'';
const shadeChip=s=>s?`<span class="shade"><i style="background:${SHADES[s]||'#eee'}"></i>${esc(s)}</span>`:'';

const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseRx(raw){
  const t=raw, low=t.toLowerCase(), r={raw,found:[]};
  for(const p of S.practices){
    if(low.includes(p.name.toLowerCase().split(' ')[0])){r.practiceId=p.id;r.found.push('practice')}
    for(const dn of p.dentists){const last=dn.split(' ').pop().toLowerCase();if(new RegExp('\\b'+last+'\\b').test(low)){r.practiceId=p.id;r.dentist=dn;if(!r.found.includes('practice'))r.found.push('practice');r.found.push('dentist')}}
  }
  const pm=t.match(/(?:patient|pt)\s*[:\-]?\s*(?:is\s+)?([A-Za-z][A-Za-z'\-]+(?:\s+[A-Za-z][A-Za-z'\-]+)?)/i);
  if(pm){r.patient=pm[1].replace(/\b\w/g,m=>m.toUpperCase());r.found.push('patient')}
  // strip dates and shades before reading tooth numbers
  let clean=t.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ').replace(/\b(BL[1-4]|[A-D][1-4](\.5)?)\b/gi,' ').replace(/\b\d+\s*(mm|unit|units)\b/gi,' ').replace(/\bthree|four|two\b/gi,' ');
  const teeth=new Set();
  clean=clean.replace(/\b([1-4])([1-8])\s*(?:-|–|to)\s*([1-4])([1-8])\b/g,(m,q1,a,q2,b)=>{if(q1===q2){const lo=Math.min(+a,+b),hi=Math.max(+a,+b);for(let i=lo;i<=hi;i++)teeth.add(+(q1+i))}return ' '});
  (clean.match(/\b[1-4][1-8]\b/g)||[]).forEach(n=>teeth.add(+n));
  if(teeth.size){r.teeth=[...teeth];r.found.push('teeth')}
  const sm=t.match(/\b(BL[1-4]|[A-D][1-4](?:\.5)?)\b/i);
  if(sm&&SHADES[sm[1].toUpperCase()]){r.shade=sm[1].toUpperCase();r.found.push('shade')}
  const has=w=>new RegExp(w,'i').test(low);
  r.code=has('implant')?'impl-crown':has('full denture|complete denture')?'full-denture':has('partial|co-?cr|chrome')?'partial':has('splint|night ?guard|occlusal')?'splint':
    has('veneer')?'veneer':has('inlay|onlay')?'inlay':has('bridge')?'zr-bridge':has('e\\.?max|lithium')?'emax-crown':has('pfm|bonded')?'pfm-crown':has('gold')?'gold-crown':has('crown|zirc')?'zr-crown':null;
  if(r.code)r.found.push('code'); else r.code='zr-crown';
  r.rush=has('\\brush\\b|urgent|asap');if(r.rush)r.found.push('rush');
  const dm=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  const wd=low.match(/\b(?:by|before|due|back|on)\s+(?:next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if(dm){const y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):TODAY.slice(0,4);let ds=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;if(!dm[3]&&ds<TODAY)ds=(+y+1)+ds.slice(4);r.due=ds;r.found.push('due')}
  else if(wd){const target=DAYS.indexOf(wd[1]);let n=(target-new Date(TODAY+'T00:00').getDay()+7)%7||7;r.due=addDays(TODAY,n);r.found.push('due')}
  else r.due=addDays(TODAY,r.rush?3:7);
  const nm=t.match(/notes?\s*[:\-]\s*(.+)/i);if(nm){r.notes=nm[1].trim();r.found.push('notes')}
  if(teeth.size>=3&&r.code==='zr-crown'&&/bridge|pontic/i.test(low))r.code='zr-bridge';
  return r;
}

          <div class="field"><label for="po-p">Patient</label><input id="po-p" required></div>
          <div class="field"><label for="po-c">Restoration</label><select id="po-c">${Object.entries(CATALOG).map(([k,v])=>`<option value="${k}">${esc(v.name)} — ${money(v.price*(1-p.disc/100))}</option>`).join('')}</select></div>
          <div class="field"><label for="po-t">Teeth (FDI)</label><input id="po-t" placeholder="e.g. 21"></div>
          <div class="field"><label for="po-s">Shade</label><select id="po-s"><option value="">None</option>${Object.keys(SHADES).map(s=>`<option>${s}</option>`).join('')}</select></div>
          <div class="field"><label for="po-due">Needed by</label><input id="po-due" type="date" value="${addDays(TODAY,7)}"></div>
          <div class="field full"><label for="po-n">Notes</label><input id="po-n"></div>
          <div class="field full"><button class="btn pri" type="submit">Send to lab</button></div>
        </form></div>
      <div class="panel"><h3>Invoices</h3><div class="tbl"><table><tr><th>Invoice</th><th>Date</th><th class="r">Total</th><th>Status</th></tr>
        ${inv.map(i=>`<tr><td class="mono">${esc(i.no)}</td><td>${fmtShort(i.date)}</td><td class="r">${money(invTotal(i).total)}</td><td>${i.paid?'<span class="chip good">Paid</span>':diff(TODAY,i.due)>0?'<span class="chip bad">Overdue</span>':'<span class="chip">Open</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No invoices</td></tr>'}
      </table></div></div>
    </div>
  </div>`;
};

/* --- billing --- */
const invTotal=i=>{const ex=i.lines.reduce((s,l)=>s+l.qty*l.unit,0);const gst=Math.round(ex*10)/100;return {ex,gst,total:ex+gst}};
const BUCKETS=['Current','31–60','61–90','90+'];
const bucket=i=>{const a=diff(TODAY,i.date);return a<=30?0:a<=60?1:a<=90?2:3};
V.billing=()=>{
  const ready=S.cases.filter(c=>c.stage===5&&!c.invoiced);
  const byP=S.practices.map(p=>({p,cs:ready.filter(c=>c.practiceId===p.id)})).filter(x=>x.cs.length);
  const open=S.invoices.filter(i=>!i.paid);
  const aging=S.practices.map(p=>{const b=[0,0,0,0];open.filter(i=>i.practiceId===p.id).forEach(i=>b[bucket(i)]+=invTotal(i).total);return {p,b}});
  const tot=[0,1,2,3].map(k=>aging.reduce((s,a)=>s+a.b[k],0));
  return `
  <div class="viewhead"><div><h2>Billing</h2><p>Dispatched work becomes GST invoices at each practice's prices. Remakes are credited automatically. Export to Xero as a sales-invoice import file.</p></div></div>
  <div class="grid2">
    <div class="panel"><h3>Ready to invoice</h3>
      ${byP.length?`<div class="tbl"><table><tr><th>Practice</th><th class="r">Cases</th><th class="r">Ex GST</th></tr>${byP.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r">${x.cs.length}</td><td class="r">${money(x.cs.reduce((s,c)=>s+caseTotal(c),0))}</td></tr>`).join('')}</table></div>
      <div class="actions" style="margin-top:12px"><button class="btn pri" data-act="invoiceall">Create ${byP.length} invoice${byP.length===1?'':'s'}</button></div>`:'<div class="empty">No dispatched work waiting to be invoiced.</div>'}
    </div>
    <div class="panel"><h3>Accounts receivable aging</h3><div class="tbl"><table><tr><th>Practice</th>${BUCKETS.map(b=>`<th class="r">${b}</th>`).join('')}</tr>
      ${aging.map(a=>`<tr><td>${esc(a.p.name)}</td>${a.b.map((v,k)=>`<td class="r" style="${v&&k>=2?'color:var(--bad);font-weight:600':''}">${v?money(v):'—'}</td>`).join('')}</tr>`).join('')}
      <tr><td><b>Total</b></td>${tot.map(v=>`<td class="r"><b>${money(v)}</b></td>`).join('')}</tr></table></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>Invoices</h3><div class="tbl"><table><tr><th>Invoice</th><th>Practice</th><th>Date</th><th>Due</th><th class="r">Ex GST</th><th class="r">GST</th><th class="r">Total</th><th></th></tr>
    ${S.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>{const t=invTotal(i);return `<tr><td class="mono">${esc(i.no)}</td><td>${esc(prac(i.practiceId).name)}</td><td>${fmtShort(i.date)}</td><td>${fmtShort(i.due)}</td><td class="r">${money(t.ex)}</td><td class="r">${money(t.gst)}</td><td class="r"><b>${money(t.total)}</b></td>
      <td>${i.paid?'<span class="chip good">Paid</span>':`<button class="btn sm" data-act="paid" data-id="${i.id}">Mark paid</button>`}</td></tr>`}).join('')}
  </table></div></div>
  <div class="grid2" style="margin-top:16px">
    <div class="panel"><h3>Price book</h3><p class="hint" style="margin-top:4px">Lab list prices, ex GST. Each practice's discount applies to every item.</p>
      <div class="tbl" style="margin-top:8px"><table><tr><th>Item</th><th>Per</th><th class="r">List price</th></tr>
      ${Object.entries(CATALOG).map(([k,v])=>`<tr><td>${esc(v.name)}</td><td class="muted">${v.unit}</td><td class="r"><input type="number" step="5" min="0" data-price="${k}" value="${v.price}" aria-label="${esc(v.name)} price"></td></tr>`).join('')}</table></div>
      <div class="tbl" style="margin-top:12px"><table><tr><th>Practice</th><th class="r">Discount %</th></tr>
      ${S.practices.map(p=>`<tr><td>${esc(p.name)}</td><td class="r"><input type="number" min="0" max="50" data-disc="${p.id}" value="${p.disc}" aria-label="${esc(p.name)} discount"></td></tr>`).join('')}</table></div>
    </div>
    <div class="panel"><h3>Xero export</h3><p class="hint" style="margin-top:4px">Open invoices in Xero's sales-invoice CSV layout, tax type "GST on Income", account ${esc(S.lab.acct)}. In Xero: Business › Invoices › Import.</p>
      <div class="field" style="margin-top:8px"><label for="xero">CSV</label><textarea id="xero" rows="12" class="rx" readonly>${esc(xeroCsv())}</textarea></div>
      <div class="actions" style="margin-top:8px"><button class="btn" data-act="copyxero">Copy CSV</button></div></div>
  </div>`;
};
function xeroCsv(){
  const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  const rows=[['*ContactName','EmailAddress','*InvoiceNumber','*InvoiceDate','*DueDate','Description','*Quantity','*UnitAmount','*AccountCode','*TaxType','Currency']];
  S.invoices.filter(i=>!i.paid).forEach(i=>{const p=prac(i.practiceId);i.lines.forEach(l=>rows.push([p.name,p.email,i.no,fmtShort(i.date),fmtShort(i.due),l.desc,l.qty,l.unit.toFixed(2),S.lab.acct,'GST on Income','AUD']))});
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function invoiceAll(){
  const ready=S.cases.filter(c=>c.stage===5&&!c.invoiced);let n=0;
  S.practices.forEach(p=>{const cs=ready.filter(c=>c.practiceId===p.id);if(!cs.length)return;
    const lines=[];cs.forEach(c=>c.items.forEach(it=>lines.push({desc:`${c.no} ${c.patient} — ${itemLabel(it)}${it.teeth.length?' ('+it.teeth.join(', ')+')':''}${c.remake?' — remake, no charge':''}`,qty:units(it),unit:priceFor(c,it)})));
    S.invoices.push({id:uid(),no:'INV-'+(S.inv++),practiceId:p.id,date:TODAY,due:addDays(TODAY,30),paid:false,lines});
    cs.forEach(c=>c.invoiced=true);n++});
  save();toast(n+' invoice'+(n===1?'':'s')+' created');
}

/* --- settings --- */
function openSettings(){
  const L=S.lab;
  $('#dlgbody').innerHTML=`<button class="iconbtn x" data-act="close">Close</button><h2>Lab settings</h2>
   <form id="labform" class="form">
     <div class="field full"><label for="ln">Lab name</label><input id="ln" value="${esc(L.name)}"></div>
     <div class="field"><label for="la">ABN</label><input id="la" value="${esc(L.abn)}"></div>
     <div class="field"><label for="lc">Xero sales account code</label><input id="lc" value="${esc(L.acct)}"></div>
     <div class="field full"><label for="ld">Address (printed on TGA statements)</label><input id="ld" value="${esc(L.addr)}"></div>
     <div class="field full"><button class="btn pri" type="submit">Save settings</button></div></form>
   <div class="sect"><h4>Demo data</h4><p class="hint">Everything in this prototype is example data saved in this browser only.</p>
   <div class="actions" style="margin-top:8px"><button class="btn" data-act="reset">Reset example data</button></div></div>`;
  $('#dlg').showModal();
}

/* ---------- router & events ---------- */
const ROUTES=['board','intake','bench','portal','billing'];
function render(){
  let r=location.hash.slice(1); if(!ROUTES.includes(r))r='board';
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#labname').textContent='· '+S.lab.name;
  $('#view').innerHTML=V[r]();
}
window.addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,c=id&&caseById(id);
  if(a==='open')openCase(id);
  else if(a==='close')$('#dlg').close();
  else if(a==='advance'){advance(c);render();openCase(id);toast(c.stage===5?'Dispatched':'Moved to '+STAGES[c.stage])}
  else if(a==='back'){c.stage--;c.history.push({d:TODAY,stage:c.stage,who:'Lab',txt:'Sent back to '+STAGES[c.stage]});save();render();openCase(id)}
  else if(a==='remake'){c.remake=!c.remake;c.history.push({d:TODAY,stage:c.stage,who:'Lab',txt:c.remake?'Flagged as remake — no charge':'Remake flag cleared'});save();render();openCase(id)}
  else if(a==='tga'){$('#tgaout').innerHTML=`<div class="sect"><h4>TGA custom-made device statement</h4><pre class="doc" id="tgatxt">${esc(tgaText(c))}</pre><div class="actions" style="margin-top:8px"><button class="btn sm" data-act="copytga">Copy statement</button></div></div>`;$('#tgaout').scrollIntoView({behavior:'smooth'})}
  else if(a==='copytga')copy($('#tgatxt').textContent,'Statement copied');
  else if(a==='sample'){draft={raw:RX_SAMPLES[+b.dataset.i].txt};render()}
  else if(a==='read'){const raw=$('#rxtxt').value.trim();if(!raw){toast('Paste an Rx first');return}draft=parseRx(raw);render();toast(draft.found.length+' fields read — check before creating')}
  else if(a==='tech'){benchTech=id;render()}
  else if(a==='clock'){const o=S.clock.find(k=>k.techId===benchTech&&!k.out);if(o)o.out=new Date().toISOString();else S.clock.push({techId:benchTech,in:new Date().toISOString()});save();render();toast(o?'Clocked out':'Clocked in')}
  else if(a==='benchdone'){advance(c,tech(benchTech).name);render();toast('Sent on — pay credited')}
  else if(a==='invoiceall'){invoiceAll();render()}
  else if(a==='paid'){const i=S.invoices.find(x=>x.id===id);i.paid=true;i.paidDate=TODAY;save();render();toast(i.no+' marked paid')}
  else if(a==='copyxero')copy($('#xero').value,'CSV copied');
  else if(a==='settings')openSettings();
  else if(a==='reset'){S=seed();save();draft=null;$('#dlg').close();render();toast('Example data reset')}
});
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>toast('Select the text and copy it'))}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filt.q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
  if(t.dataset.price){CATALOG[t.dataset.price].price=+t.value||0;S.prices=Object.fromEntries(Object.entries(CATALOG).map(([k,v])=>[k,v.price]));save()}
  if(t.dataset.disc){prac(t.dataset.disc).disc=+t.value||0;save()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pf'){filt.p=t.value;render()}
  if(t.id==='pp'){portalP=t.value;render()}
  if(t.id==='fp'){const p=prac(t.value);$('#fd').innerHTML=p.dentists.map(n=>`<option>${esc(n)}</option>`).join('')}
  if(t.id==='asg'){const c=caseById(t.dataset.id);c.assigned[c.stage]=t.value;save();render();toast('Assigned to '+tech(t.value).name)}
  if(t.id==='due2'){const c=caseById(t.dataset.id);c.due=t.value;save();render();openCase(c.id)}
  if(t.dataset.price||t.dataset.disc)render();
});
const teethIn=v=>(v.match(/\b[1-4][1-8]\b/g)||[]).map(Number);
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='caseform'){
    const c=createCase({practiceId:$('#fp').value,dentist:$('#fd').value,patient:$('#fpt').value.trim(),code:$('#fc').value,teeth:teethIn($('#ft').value),shade:$('#fs').value,due:$('#fdue').value,rush:$('#fr').value==='1',notes:$('#fn').value,source:'email'});
    draft=null;location.hash='board';render();openCase(c.id);toast(c.no+' created');
  }
  if(f.id==='portalform'){
    const p=prac(portalP);
    const c=createCase({practiceId:p.id,dentist:$('#po-d').value,patient:$('#po-p').value.trim(),code:$('#po-c').value,teeth:teethIn($('#po-t').value),shade:$('#po-s').value,due:$('#po-due').value,notes:$('#po-n').value,source:'portal'});
    render();toast(c.no+' sent to the lab');
  }
  if(f.id==='labform'){Object.assign(S.lab,{name:$('#ln').value.trim()||'Your Dental Lab',abn:$('#la').value,acct:$('#lc').value,addr:$('#ld').value});save();$('#dlg').close();render();toast('Settings saved')}
});
if(S.prices)Object.entries(S.prices).forEach(([k,v])=>{if(CATALOG[k])CATALOG[k].price=v});
render();
</script>

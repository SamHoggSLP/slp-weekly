<title>Benchline Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Palette sampled from the lab: blue-grey mosaic tile, pale aqua, board-formed concrete, charcoal. Thin tracked Lato echoes the wordmark.
   Layout: sticky top bar + tab strip; each view is a full-width work surface. Board scrolls sideways inside its own track. */
:root{
  --bg:#e3e2df; --surface:#f4f4f2; --sunk:#d7d5d1; --ink:#2f2e2d; --muted:#686764; --line:#c8c6c2;
  --accent:#a9c2d6; --accent-ink:#2a2f34; --accent-soft:#dfe8ef; --accent-deep:#4c6c86; --aqua:#b4d2d2;
  --warn:#8f5a00; --warn-bg:#f3e6cc; --bad:#a8342c; --bad-bg:#f2dedb; --good:#2c6b4a; --good-bg:#dbe8dd;
  --display:"Lato", "Helvetica Neue", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2f2e2d; --surface:#383738; --sunk:#333232; --ink:#eceae6; --muted:#a8a6a2; --line:#4a4949;
  --accent:#b4d2d2; --accent-ink:#2f2e2d; --accent-soft:#3c4849; --accent-deep:#b4d2d2; --aqua:#b4d2d2;
  --warn:#f0b75e; --warn-bg:#46391f; --bad:#ff958b; --bad-bg:#4a2b28; --good:#8fd6b0; --good-bg:#2b3f33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2f2e2d; --surface:#383738; --sunk:#333232; --ink:#eceae6; --muted:#a8a6a2; --line:#4a4949;
  --accent:#b4d2d2; --accent-ink:#2f2e2d; --accent-soft:#3c4849; --accent-deep:#b4d2d2; --aqua:#b4d2d2;
  --warn:#f0b75e; --warn-bg:#46391f; --bad:#ff958b; --bad-bg:#4a2b28; --good:#8fd6b0; --good-bg:#2b3f33; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;font-weight:400}
h2{font-weight:300;letter-spacing:.14em;text-transform:uppercase}
h3{font-weight:700;letter-spacing:.02em}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;flex:none}
.brand b{font-family:var(--display);font-weight:300;font-size:1.15rem;letter-spacing:.24em;text-transform:uppercase}
.brand .lab{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}

main{padding-block:20px 60px;max-width:1400px;margin:0 auto}
.viewhead{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.viewhead .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep)}
.shade{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.78rem}
.shade i{width:11px;height:14px;border-radius:3px 3px 5px 5px;border:1px solid var(--line);display:inline-block}

/* brief strip */
.brief{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 16px;margin-bottom:16px}
.brief .stat b{font-family:var(--display);font-weight:300;font-size:1.7rem;margin-right:6px}
.brief .stat{color:var(--muted);font-size:.88rem}
.brief .note{flex-basis:100%;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* board */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background-color:var(--sunk);background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);background-size:14px 14px;background-position:-1px -1px;border-radius:var(--r);padding:10px;min-height:200px}
.col h3{background:var(--sunk);border-radius:6px;padding:4px 6px;margin:0 0 10px!important}
.col h3{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin:2px 4px 10px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;position:relative}
.card:hover{border-color:var(--accent-deep)}
.card.overdue{box-shadow:inset 3px 0 0 var(--bad)}
.card.today{box-shadow:inset 3px 0 0 var(--warn)}
.card .no{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.card .what{font-weight:600;margin:2px 0}
.card .who{font-size:.82rem;color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field.found input,.field.found select{border-color:var(--good);background:var(--good-bg)}
textarea{resize:vertical}
.rx{min-height:190px;font-family:var(--mono);font-size:.85rem;line-height:1.55}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td input{width:5.5em;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;text-align:right}

/* stage tracker */
.track{display:flex;gap:4px;margin:10px 0}
.track span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track span.done{background:var(--accent)}
.track span.now{background:var(--accent);opacity:.4}
.track span.done{background:var(--accent-deep)}
.tracklabels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-family:var(--mono)}

/* bench */
.techs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.techs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.88rem}
.techs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phone{max-width:430px;border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:18px;margin:0 auto}
.phone .head{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.phone .head small{opacity:.7;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.phone .head h3{font-size:1.25rem;margin-top:2px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qlist{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px}
.kpi b{display:block;font-family:var(--display);font-weight:300;font-size:1.5rem}
.kpi span{font-size:.78rem;color:var(--muted)}

/* portal */
.portalhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background-color:var(--accent-soft);background-image:linear-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px);background-size:16px 16px;border-radius:var(--r);padding:16px;margin-bottom:16px}
.portalhead h2{color:var(--accent-deep);font-size:1.3rem}
.pcase{padding:12px 0;border-bottom:1px solid var(--line)}
.pcase:last-child{border-bottom:0}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg .x{position:absolute;right:12px;top:12px}
.sect{border-top:1px solid var(--line);padding-top:12px}
.sect h4{margin:0 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;font-size:.86rem}
.timeline li{display:flex;gap:10px;padding:4px 0}
.timeline li .d{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:7.5em;flex:none}
pre.doc{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:14px;font-family:var(--mono);font-size:.78rem;line-height:1.55;margin:0;max-height:320px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}
.empty{color:var(--muted);font-size:.88rem;padding:10px 4px}
@media (prefers-reduced-motion: no-preference){.card,.btn{transition:border-color .12s,background .12s}}
/* v2 additions: tooth chart, lab slip, allocation */
.chartwrap{overflow-x:auto;padding-bottom:2px}
.chart{min-width:340px;display:flex;flex-direction:column;gap:6px}
.chartrow{display:grid;grid-template-columns:repeat(8,minmax(18px,1fr)) 10px repeat(8,minmax(18px,1fr));gap:3px;align-items:end}
.chartrow.lower{align-items:start}
.chartlbl{display:flex;justify-content:space-between;font:600 .66rem var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tooth{aspect-ratio:3/4;min-width:0;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:5px 5px 10px 10px;font:600 .66rem var(--mono);color:var(--muted);display:grid;place-items:center}
.lower .tooth{border-radius:10px 10px 5px 5px}
.tooth.m{aspect-ratio:4/4}
.tooth.on,.tooth[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-deep);color:var(--accent-ink)}
span.tooth{cursor:default}
.quote{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.88rem;padding:10px 12px;background:var(--sunk);border-radius:8px;margin-top:8px}
.quote b{font-family:var(--display);font-size:1.15rem;font-weight:400}
.missing{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:.88rem}
.missing.ok{background:var(--good-bg);color:var(--good)}
.slip{background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sliphead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.slipno{font:600 1.7rem/1.1 var(--mono);letter-spacing:.02em}
.eyebrow{font:600 .68rem var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.slipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px 16px;font-size:.88rem}
.slipgrid div span{display:block;font:600 .66rem var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stamp{border:2px solid var(--bad);color:var(--bad);font:700 .78rem var(--mono);padding:2px 8px;border-radius:4px;transform:rotate(-3deg);display:inline-block;letter-spacing:.1em}
.box{display:inline-block;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;vertical-align:middle}
.box.done{background:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent-deep)}
.meter.over i{background:var(--bad)}
.skill{font-size:.72rem}
td.c,th.c{text-align:center}
td input[type=checkbox]{width:auto}
.stagehint{font-size:.78rem;color:var(--muted);margin:-6px 4px 10px}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="7.5" height="7.5" rx="1" fill="var(--accent)"/><rect x="10.5" y="2" width="7.5" height="7.5" rx="1" fill="var(--aqua)"/><rect x="19" y="2" width="7.5" height="7.5" rx="1" fill="var(--accent)"/><rect x="2" y="10.5" width="7.5" height="7.5" rx="1" fill="var(--aqua)"/><rect x="10.5" y="10.5" width="7.5" height="7.5" rx="1" fill="var(--accent)"/><rect x="19" y="10.5" width="7.5" height="7.5" rx="1" fill="var(--aqua)"/><rect x="2" y="19" width="7.5" height="7.5" rx="1" fill="var(--accent)"/><rect x="10.5" y="19" width="7.5" height="7.5" rx="1" fill="var(--aqua)"/><rect x="19" y="19" width="7.5" height="7.5" rx="1" fill="var(--accent)"/></svg>
      <b>Benchline</b><span class="lab" id="labname"></span>
    </div>
    <span class="sp"></span>
    <button class="iconbtn" data-act="settings">Lab settings</button>
  </div>
  <nav class="tabs wrap" id="tabs">
    <a href="#board">Cases</a><a href="#intake">Rx intake</a><a href="#allocation">Allocation</a><a href="#bench">Bench</a><a href="#portal">Dentist portal</a><a href="#billing">Billing</a>
  </nav>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
function addWD(s,n){const d=new Date(s+'T00:00');while(n>0){d.setDate(d.getDate()+1);const w=d.getDay();if(w>0&&w<6)n--}return iso(d)}
function wdBetween(a,b){let n=0,d=new Date(a+'T00:00');const e=new Date(b+'T00:00');while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w>0&&w<6)n++}return n}
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtShort=s=>new Date(s+'T00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'});
const money=n=>(+n||0).toLocaleString('en-AU',{style:'currency',currency:'AUD'});
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}

/* ---------- domain ---------- */
// Seven working stages plus Dispatched. Names are a first guess at the lab's floor; rename here once mapped.
const STAGES=[
  {k:'booked',n:'Booked'},{k:'received',n:'Received'},{k:'models',n:'Models & scan'},{k:'design',n:'Design'},
  {k:'milling',n:'Mill / print'},{k:'ceramics',n:'Ceramics'},{k:'qc',n:'QC'},{k:'dispatched',n:'Dispatched'}];
const DONE=STAGES.length-1;
const SN=i=>STAGES[i].n;
const SKILLS=[['received','Receiving'],['models','Models & scan'],['design','CAD design'],['implant','Implant design'],['milling','Mill / print'],['ceramics','Ceramics'],['anterior','Anterior aesthetics'],['qc','QC']];
const FRAC={received:0,models:.15,design:.35,milling:.5,ceramics:.85,qc:1};   // share of turnaround each department should be finished by
const PIECE={models:3,design:14,milling:5,ceramics:24,qc:4};
const SHADES={A1:'#f2e9d4',A2:'#eddcbc',A3:'#e5cfa6','A3.5':'#dcc195',A4:'#cfb084',B1:'#f4ecd8',B2:'#eee0bf',B3:'#e3cd9f',C1:'#e4dbc5',C2:'#d9cdb0',C3:'#cdbf9f',D2:'#e3d6c0',D3:'#d8c8ac',BL1:'#faf7f0',BL2:'#f7f2e8'};
// tat: [base working days, units included, +1 day per N extra units]
const CATALOG={
  'zr-crown':{name:'Zirconia crown',unit:'tooth',price:260,mat:'Monolithic zirconia',tat:[5,2,2],shade:1},
  'emax-crown':{name:'IPS e.max crown',unit:'tooth',price:310,mat:'Lithium disilicate',tat:[5,2,2],shade:1},
  'layered-crown':{name:'Layered zirconia crown',unit:'tooth',price:420,mat:'Zirconia core, layered porcelain',tat:[6,2,2],shade:1},
  'gold-crown':{name:'Full gold crown',unit:'tooth',price:680,mat:'Type III gold alloy',tat:[6,2,2],shade:0},
  'impl-crown':{name:'Implant crown, screw-retained',unit:'tooth',price:540,mat:'Zirconia on titanium base',tat:[8,1,2],shade:1},
  'zr-bridge':{name:'Zirconia bridge',unit:'unit',price:250,mat:'Monolithic zirconia',tat:[6,3,2],shade:1},
  'inlay':{name:'Inlay / onlay',unit:'tooth',price:240,mat:'Lithium disilicate',tat:[5,2,3],shade:1},
  'veneer':{name:'Veneer',unit:'tooth',price:330,mat:'Feldspathic porcelain',tat:[7,2,2],shade:1},
  'full-denture':{name:'Full denture',unit:'arch',price:760,mat:'Heat-cured acrylic, acrylic teeth',tat:[10,1,1],shade:1},

const arches=teeth=>new Set(teeth.map(t=>t<30?'U':'L')).size;
const units=it=>CATALOG[it.code].unit==='arch'?Math.max(1,arches(it.teeth)):Math.max(1,it.teeth.length);
const isAnt=t=>t%10<=3;
function turnaround(code,teeth,rush){
  const u=units({code,teeth}), [b,inc,per]=CATALOG[code].tat;
  let d=b+Math.max(0,Math.ceil((u-inc)/per)); if(rush)d=Math.max(3,d-2);
  return {u,d};
}
function missingFor(d){
  const k=CATALOG[d.code],m=[];
  if(!d.patient)m.push('patient name');
  if(k.unit!=='arch'&&!d.teeth.length)m.push('tooth numbers');
  if(k.unit==='arch'&&!d.teeth.length)m.push('which arch (upper or lower)');
  if(k.shade&&!d.shade)m.push('shade');
  if(d.code==='impl-crown'&&!/(straumann|nobel|neodent|osstem|zimmer|biohorizons|megagen|implant system|platform)/i.test(d.notes||''))m.push('implant system and platform');
  if(d.code==='zr-bridge'&&d.teeth.length<3)m.push('bridge span (abutments and pontics)');
  return m;
}

/* ---------- allocation ---------- */
function needSkills(c,s=c.stage){
  if(s===0||s===DONE)return [];
  const k=STAGES[s].k, need=[k];
  if(k==='ceramics'&&c.items.some(it=>it.teeth.some(isAnt)&&CATALOG[it.code].unit!=='arch'))need.push('anterior');
  if(k==='design'&&c.items.some(it=>it.code==='impl-crown'))need.push('implant');
  return need;
}
const canDo=(t,c)=>needSkills(c).every(k=>t.skills.includes(k));
const load=tid=>S.cases.filter(c=>active(c)&&c.assigned[c.stage]===tid).reduce((s,c)=>s+caseUnits(c),0);
function suggest(c){
  const u=caseUnits(c);
  const cands=S.techs.filter(t=>canDo(t,c));
  if(!cands.length)return null;
  return cands.sort((a,b)=>(load(a.id)+u)/a.cap-(load(b.id)+u)/b.cap)[0];
}
function stageLoad(k){
  const demand=S.cases.filter(c=>active(c)&&STAGES[c.stage].k===k).reduce((s,c)=>s+caseUnits(c),0);
  const cap=S.techs.filter(t=>t.skills.includes(k)).reduce((s,t)=>s+t.cap,0);
  return {demand,cap};
}

const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseRx(raw){
  const t=raw, low=t.toLowerCase(), r={raw,found:[],teeth:[]};
  for(const p of S.practices){
    if(low.includes(p.name.toLowerCase().split(' ')[0])){r.practiceId=p.id;r.found.push('practice')}
    for(const dn of p.dentists){const last=dn.split(' ').pop().toLowerCase();if(new RegExp('\\b'+last+'\\b').test(low)){r.practiceId=p.id;r.dentist=dn;if(!r.found.includes('practice'))r.found.push('practice');r.found.push('dentist')}}
  }
  const pm=t.match(/(?:patient|pt)\s*[:\-]?\s*(?:is\s+)?([A-Za-z][A-Za-z'\-]+(?:[ \t]+[A-Za-z][A-Za-z'\-]+)?)/i);
  if(pm){r.patient=pm[1].replace(/\b\w/g,m=>m.toUpperCase());r.found.push('patient')}
  let clean=t.replace(/#\S+/g,' ').replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ').replace(/\b(BL[1-4]|[A-D][1-4](\.5)?)\b/gi,' ').replace(/\b\d+\s*(mm|unit|units)\b/gi,' ').replace(/units?\s*:\s*\d+/gi,' ');
  const teeth=new Set();
  clean=clean.replace(/\b([1-4])([1-8])\s*(?:-|–|to)\s*([1-4])([1-8])\b/g,(m,q1,a,q2,b)=>{if(q1===q2){const lo=Math.min(+a,+b),hi=Math.max(+a,+b);for(let i=lo;i<=hi;i++)teeth.add(+(q1+i))}return ' '});
  (clean.match(/\b[1-4][1-8]\b/g)||[]).forEach(n=>teeth.add(+n));
  if(teeth.size){r.teeth=[...teeth];r.found.push('teeth')}
  const sm=t.match(/\b(BL[1-4]|[A-D][1-4](?:\.5)?)\b/);
  if(sm&&SHADES[sm[1].toUpperCase()]){r.shade=sm[1].toUpperCase();r.found.push('shade')}
  const has=w=>new RegExp(w,'i').test(low);
  r.code=has('implant')?'impl-crown':has('full denture|complete denture')?'full-denture':has('splint|night ?guard|occlusal')?'splint':
    has('veneer')?'veneer':has('inlay|onlay')?'inlay':has('bridge|pontic')?'zr-bridge':has('layered')?'layered-crown':has('e\\.?max|lithium')?'emax-crown':has('gold')?'gold-crown':has('crown|zirc')?'zr-crown':null;
  if(r.code)r.found.push('code'); else r.code='zr-crown';
  r.rush=has('\\brush\\b|urgent|asap');if(r.rush)r.found.push('rush');
  const dm=t.match(/(?:due|return|back|by)\D{0,6}(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i);
  const wd=low.match(/\b(?:by|before|due|back|on)\s+(?:next\s+)?(monday|tuesday|wednesday|thursday|friday)\b/);
  if(dm){const y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):TODAY.slice(0,4);let ds=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;if(!dm[3]&&ds<TODAY)ds=(+y+1)+ds.slice(4);r.due=ds;r.dueFound=1;r.found.push('due')}
  else if(wd){let n=(DAYS.indexOf(wd[1])-new Date(TODAY+'T00:00').getDay()+7)%7||7;r.due=addDays(TODAY,n);r.dueFound=1;r.found.push('due')}
  const nm=t.match(/notes?\s*[:\-]\s*(.+)/i);r.notes=nm?nm[1].trim():(/straumann|nobel|neodent/i.test(t)?(t.match(/(straumann|nobel|neodent)[^\n.]*/i)||[''])[0]:'');
  if(r.notes)r.found.push('notes');
  if(/seazona/i.test(t))r.source='Seazona';
  return r;
}
function createCase(data){

    items:[{code:data.code,teeth:data.teeth,shade:data.shade}],stage:inHand?1:0,booked:TODAY,received:inHand?TODAY:null,due:data.due,rush:!!data.rush,remake:false,notes:data.notes||'',

  const s=inHand&&suggest(c); if(s)c.assigned[1]=s.id;
  S.cases.push(c);save();return c;
}

        <div class="field"><label for="po-s">Shade</label><select id="po-s" data-quote="po"><option value="">Choose shade</option>${Object.keys(SHADES).map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="field"><label for="po-due">Seat appointment</label><input id="po-due" type="date"></div>
        <div class="field full"><label for="po-n">Notes</label><input id="po-n" data-quote="po" placeholder="Implant system, prep notes, anything the bench should know"></div>
        <div class="field full" id="miss-po"></div>
        <div class="field full"><button class="btn pri" type="submit">Book with the lab</button></div>
      </form></div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel"><h3>Your cases</h3>
      ${cs.map(c=>`<div class="pcase"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(c.patient)} — ${esc(itemLabel(c.items[0]))}</b>${c.stage===DONE?'<span class="chip good">Dispatched '+fmtD(lastMove(c))+'</span>':'<span class="chip">Back '+fmtD(c.due)+'</span>'}</div>
        <div class="muted" style="font-size:.84rem">${esc(c.no)} · ${esc(c.dentist)} · ${c.stage===0?'Booked — waiting for the box':esc(SN(c.stage))}</div>
        <div class="track">${STAGES.map((s,i)=>`<span class="${i<c.stage||c.stage===DONE?'done':i===c.stage?'now':''}"></span>`).join('')}</div></div>`).join('')||'<div class="empty">No cases yet.</div>'}</div>
      <div class="panel"><h3>Invoices</h3><div class="tbl"><table><tr><th>Invoice</th><th>Date</th><th class="r">Total</th><th>Status</th></tr>
        ${inv.map(i=>`<tr><td class="mono">${esc(i.no)}</td><td>${fmtShort(i.date)}</td><td class="r">${money(invTotal(i).total)}</td><td>${i.paid?'<span class="chip good">Paid</span>':diff(TODAY,i.due)>0?'<span class="chip bad">Overdue</span>':'<span class="chip">Open</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No invoices</td></tr>'}
      </table></div></div>
    </div>
  </div>`;
};
function refreshPortal(){
  if(!$('#quote-po'))return;
  const code=$('#po-c').value, teeth=[...charts.po];
  $('#quote-po').innerHTML=quoteHtml(code,teeth,false,addDays(TODAY,1));
  const earliest=addWD(addDays(TODAY,1),turnaround(code,teeth,false).d), due=$('#po-due');
  due.min=earliest; if(!due.value||due.value<earliest)due.value=earliest;
  const m=missingFor({code,teeth,patient:$('#po-p').value.trim(),shade:$('#po-s').value,notes:$('#po-n').value});
  $('#miss-po').innerHTML=m.length?`<div class="missing">Still needed: ${m.join(', ')}.</div>`:'<div class="missing ok">Ready to book.</div>';
}

/* --- billing --- */
const invTotal=i=>{const ex=i.lines.reduce((s,l)=>s+l.qty*l.unit,0);const gst=Math.round(ex*10)/100;return {ex,gst,total:ex+gst}};
const BUCKETS=['Current','31–60','61–90','90+'];
const bucket=i=>{const a=diff(TODAY,i.date);return a<=30?0:a<=60?1:a<=90?2:3};
V.billing=()=>{
  const ready=S.cases.filter(c=>c.stage===DONE&&!c.invoiced);
  const byP=S.practices.map(p=>({p,cs:ready.filter(c=>c.practiceId===p.id)})).filter(x=>x.cs.length);
  const open=S.invoices.filter(i=>!i.paid);
  const aging=S.practices.map(p=>{const b=[0,0,0,0];open.filter(i=>i.practiceId===p.id).forEach(i=>b[bucket(i)]+=invTotal(i).total);return {p,b}});
  const tot=[0,1,2,3].map(k=>aging.reduce((s,a)=>s+a.b[k],0));
  return `
  <div class="viewhead"><div><h2>Billing</h2><p>Dispatched work becomes GST invoices at each practice's prices, remakes credited, and goes to Xero as an import file. Xero stays the books.</p></div></div>
  <div class="grid2">
    <div class="panel"><h3>Ready to invoice</h3>
      ${byP.length?`<div class="tbl"><table><tr><th>Practice</th><th class="r">Cases</th><th class="r">Ex GST</th></tr>${byP.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r">${x.cs.length}</td><td class="r">${money(x.cs.reduce((s,c)=>s+caseTotal(c),0))}</td></tr>`).join('')}</table></div>
      <div class="actions" style="margin-top:12px"><button class="btn pri" data-act="invoiceall">Create ${byP.length} invoice${byP.length===1?'':'s'}</button></div>`:'<div class="empty">No dispatched work waiting to be invoiced.</div>'}
    </div>
    <div class="panel"><h3>Accounts receivable aging</h3><div class="tbl"><table><tr><th>Practice</th>${BUCKETS.map(b=>`<th class="r">${b}</th>`).join('')}</tr>
      ${aging.map(a=>`<tr><td>${esc(a.p.name)}</td>${a.b.map((v,k)=>`<td class="r" style="${v&&k>=2?'color:var(--bad);font-weight:600':''}">${v?money(v):'—'}</td>`).join('')}</tr>`).join('')}
      <tr><td><b>Total</b></td>${tot.map(v=>`<td class="r"><b>${money(v)}</b></td>`).join('')}</tr></table></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>Invoices</h3><div class="tbl"><table><tr><th>Invoice</th><th>Practice</th><th>Date</th><th>Due</th><th class="r">Ex GST</th><th class="r">GST</th><th class="r">Total</th><th></th></tr>
    ${S.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>{const t=invTotal(i);return `<tr><td class="mono">${esc(i.no)}</td><td>${esc(prac(i.practiceId).name)}</td><td>${fmtShort(i.date)}</td><td>${fmtShort(i.due)}</td><td class="r">${money(t.ex)}</td><td class="r">${money(t.gst)}</td><td class="r"><b>${money(t.total)}</b></td>
      <td>${i.paid?'<span class="chip good">Paid</span>':`<button class="btn sm" data-act="paid" data-id="${i.id}">Mark paid</button>`}</td></tr>`}).join('')}
  </table></div></div>
  <div class="grid2" style="margin-top:16px">
    <div class="panel"><h3>Price book and turnaround</h3><p class="hint" style="margin-top:4px">List prices ex GST, and the working days each item takes. Extra units add a day per the last column.</p>
      <div class="tbl" style="margin-top:8px"><table><tr><th>Item</th><th class="r">Price</th><th class="r">Days</th><th class="r">Units incl.</th><th class="r">+1 day per</th></tr>
      ${Object.entries(CATALOG).map(([k,v])=>`<tr><td>${esc(v.name)} <span class="muted">/${v.unit}</span></td><td class="r"><input type="number" step="5" min="0" data-price="${k}" value="${v.price}" aria-label="${esc(v.name)} price"></td>${v.tat.map((n,j)=>`<td class="r"><input type="number" min="1" max="30" data-tat="${k}:${j}" value="${n}" style="width:3.5em" aria-label="${esc(v.name)} turnaround ${j}"></td>`).join('')}</tr>`).join('')}</table></div>
      <div class="tbl" style="margin-top:12px"><table><tr><th>Practice</th><th>Books via</th><th class="r">Discount %</th></tr>
      ${S.practices.map(p=>`<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.booking)}</td><td class="r"><input type="number" min="0" max="50" data-disc="${p.id}" value="${p.disc}" aria-label="${esc(p.name)} discount"></td></tr>`).join('')}</table></div>
    </div>
    <div class="panel"><h3>Xero export</h3><p class="hint" style="margin-top:4px">Open invoices in Xero's sales-invoice CSV layout, tax type "GST on Income", account ${esc(S.lab.acct)}.</p>
      <div class="field" style="margin-top:8px"><label for="xero">CSV</label><textarea id="xero" rows="12" class="rx" readonly>${esc(xeroCsv())}</textarea></div>
      <div class="actions" style="margin-top:8px"><button class="btn" data-act="copyxero">Copy CSV</button></div></div>
  </div>`;
};
function xeroCsv(){
  const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  const rows=[['*ContactName','EmailAddress','*InvoiceNumber','*InvoiceDate','*DueDate','Description','*Quantity','*UnitAmount','*AccountCode','*TaxType','Currency']];
  S.invoices.filter(i=>!i.paid).forEach(i=>{const p=prac(i.practiceId);i.lines.forEach(l=>rows.push([p.name,p.email,i.no,fmtShort(i.date),fmtShort(i.due),l.desc,l.qty,(+l.unit).toFixed(2),S.lab.acct,'GST on Income','AUD']))});
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function invoiceAll(){
  const ready=S.cases.filter(c=>c.stage===DONE&&!c.invoiced);let n=0;
  S.practices.forEach(p=>{const cs=ready.filter(c=>c.practiceId===p.id);if(!cs.length)return;
    const lines=[];cs.forEach(c=>c.items.forEach(it=>lines.push({desc:`${c.no} ${c.patient} — ${itemLabel(it)} (${teethTxt(it)})${c.remake?' — remake, no charge':''}`,qty:units(it),unit:priceFor(c,it)})));
    S.invoices.push({id:uid(),no:'INV-'+(S.inv++),practiceId:p.id,date:TODAY,due:addDays(TODAY,30),paid:false,lines});
    cs.forEach(c=>c.invoiced=true);n++});
  save();toast(n+' invoice'+(n===1?'':'s')+' created');
}

/* --- settings --- */
function openSettings(){
  const L=S.lab;
  $('#dlgbody').innerHTML=`<button class="iconbtn x" data-act="close">Close</button><h2>Lab settings</h2>
   <form id="labform" class="form">
     <div class="field full"><label for="ln">Lab name</label><input id="ln" value="${esc(L.name)}"></div>
     <div class="field"><label for="la">ABN</label><input id="la" value="${esc(L.abn)}"></div>
     <div class="field"><label for="lc">Xero sales account code</label><input id="lc" value="${esc(L.acct)}"></div>
     <div class="field full"><label for="ld">Address (printed on lab slips and TGA statements)</label><input id="ld" value="${esc(L.addr)}"></div>
     <div class="field full"><button class="btn pri" type="submit">Save settings</button></div></form>
   <div class="sect"><h4>Demo data</h4><p class="hint">Everything here is example data saved in this browser only.</p>
   <div class="actions" style="margin-top:8px"><button class="btn" data-act="reset">Reset example data</button></div></div>`;
  $('#dlg').showModal();
}

/* ---------- router & events ---------- */
const ROUTES=['board','intake','allocation','bench','portal','billing'];
function render(){
  let r=location.hash.slice(1); if(!ROUTES.includes(r))r='board';
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#labname').textContent='· '+S.lab.name;
  $('#view').innerHTML=V[r]();
  if(r==='intake')refreshIntake(true);
  if(r==='portal')refreshPortal();
}
window.addEventListener('hashchange',render);
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>toast('Select the text and copy it'))}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,c=id&&caseById(id);
  if(a==='open')openCase(id);
  else if(a==='close')$('#dlg').close();
  else if(a==='slip')openSlip(id);
  else if(a==='tooth'){const set=charts[b.dataset.chart],t=+b.dataset.t;set.has(t)?set.delete(t):set.add(t);b.setAttribute('aria-pressed',set.has(t));b.dataset.chart==='in'?refreshIntake():refreshPortal()}
  else if(a==='advance'){advance(c);render();openCase(id);toast(c.stage===DONE?'Dispatched':c.stage===1?'Checked in':'Moved to '+SN(c.stage))}
  else if(a==='back'){c.stage--;c.history.push({d:TODAY,stage:c.stage,who:'Lab',txt:'Sent back to '+SN(c.stage)});save();render();openCase(id)}
  else if(a==='remake'){c.remake=!c.remake;c.history.push({d:TODAY,stage:c.stage,who:'Lab',txt:c.remake?'Flagged as remake — no charge':'Remake flag cleared'});save();render();openCase(id)}
  else if(a==='takesug'){c.assigned[c.stage]=b.dataset.t;save();render();openCase(id);toast('Assigned to '+tech(b.dataset.t).name)}
  else if(a==='tga'){$('#tgaout').innerHTML=`<div class="sect"><h4>TGA custom-made device statement</h4><pre class="doc" id="tgatxt">${esc(tgaText(c))}</pre><div class="actions" style="margin-top:8px"><button class="btn sm" data-act="copytga">Copy statement</button></div></div>`;$('#tgaout').scrollIntoView({behavior:'smooth'})}
  else if(a==='copytga')copy($('#tgatxt').textContent,'Statement copied');
  else if(a==='copyask')copy(askText(),'Request copied — paste it into your reply');
  else if(a==='sample'){draft={raw:RX_SAMPLES[+b.dataset.i].txt,teeth:[]};render()}
  else if(a==='read'){const raw=$('#rxtxt').value.trim();if(!raw){toast('Paste an Rx first');return}draft=parseRx(raw);render();toast(draft.found.length+' fields read — check before creating')}
  else if(a==='assignall'){let n=0;S.cases.filter(c=>active(c)&&!owner(c)).sort((a,b)=>a.due.localeCompare(b.due)).forEach(c=>{const s=suggest(c);if(s){c.assigned[c.stage]=s.id;n++}});save();render();toast(n+' cases assigned')}
  else if(a==='tech'){benchTech=id;render()}
  else if(a==='clock'){const o=S.clock.find(k=>k.techId===benchTech&&!k.out);if(o)o.out=new Date().toISOString();else S.clock.push({techId:benchTech,in:new Date().toISOString()});save();render();toast(o?'Clocked out':'Clocked in')}
  else if(a==='benchdone'){advance(c,tech(benchTech).name);render();toast('Sent on')}
  else if(a==='invoiceall'){invoiceAll();render()}
  else if(a==='paid'){const i=S.invoices.find(x=>x.id===id);i.paid=true;save();render();toast(i.no+' marked paid')}
  else if(a==='copyxero')copy($('#xero').value,'CSV copied');
  else if(a==='settings')openSettings();
  else if(a==='reset'){S=seed();save();draft=null;charts.po=new Set();$('#dlg').close();render();toast('Example data reset')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filt.q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
  if(t.dataset.price){CATALOG[t.dataset.price].price=+t.value||0;saveCatalog()}
  if(t.dataset.tat){const [k,j]=t.dataset.tat.split(':');CATALOG[k].tat[+j]=Math.max(1,+t.value||1);saveCatalog()}
  if(t.dataset.disc){prac(t.dataset.disc).disc=+t.value||0;save()}
  if(t.dataset.cap){tech(t.dataset.cap).cap=Math.max(1,+t.value||1);save()}
  if(t.dataset.quote==='in'&&t.tagName==='INPUT')refreshIntake(true);
  if(t.dataset.quote==='po'&&t.tagName==='INPUT')refreshPortal();
});
function saveCatalog(){S.prices=Object.fromEntries(Object.entries(CATALOG).map(([k,v])=>[k,v.price]));S.tats=Object.fromEntries(Object.entries(CATALOG).map(([k,v])=>[k,v.tat]));save()}
if(S.tats)Object.entries(S.tats).forEach(([k,v])=>{if(CATALOG[k])CATALOG[k].tat=v});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pf'){filt.p=t.value;render()}
  if(t.id==='pp'){portalP=t.value;charts.po=new Set();render()}
  if(t.id==='fp'){const p=prac(t.value);$('#fd').innerHTML=p.dentists.map(n=>`<option>${esc(n)}</option>`).join('');refreshIntake(true)}
  if(t.dataset.quote==='in'&&t.tagName==='SELECT')refreshIntake(t.id==='fs'?true:'reset');
  if(t.dataset.quote==='po'&&t.tagName==='SELECT')refreshPortal();
  if(t.id==='asg'){const c=caseById(t.dataset.id);if(t.value)c.assigned[c.stage]=t.value;else delete c.assigned[c.stage];save();render();openCase(c.id);toast(t.value?'Assigned to '+tech(t.value).name:'Unassigned')}
  if(t.dataset.assign){const c=caseById(t.dataset.assign);if(t.value){c.assigned[c.stage]=t.value;save();render();toast(c.no+' assigned to '+tech(t.value).name)}}
  if(t.dataset.skill){const [tid,k]=t.dataset.skill.split(':'),tt=tech(tid);tt.skills=t.checked?[...new Set([...tt.skills,k])]:tt.skills.filter(x=>x!==k);save();render()}
  if(t.id==='due2'){const c=caseById(t.dataset.id);c.due=t.value;save();render();openCase(c.id)}
  if(t.dataset.photo&&t.files[0])addPhoto(t.dataset.photo,t.files[0]);
  if(t.dataset.price||t.dataset.disc||t.dataset.cap||t.dataset.tat)render();
});
const nameOk=v=>v.trim().length>0;
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='caseform'){
    if(!nameOk($('#fpt').value)){toast('Add the patient name first');$('#fpt').focus();return}
    const c=createCase({practiceId:$('#fp').value,dentist:$('#fd').value,patient:$('#fpt').value.trim(),code:$('#fc').value,teeth:[...charts.in].sort((a,b)=>a-b),shade:$('#fs').value,due:$('#fdue').value,rush:$('#fr').value==='1',notes:$('#fn').value,source:(draft&&draft.source)||'email',inHand:$('#fbox').value==='1'});
    draft=null;location.hash='board';render();openSlip(c.id);toast(c.no+' created — lab slip ready');
  }
  if(f.id==='portalform'){
    const p=prac(portalP),code=$('#po-c').value,teeth=[...charts.po].sort((a,b)=>a-b);
    const m=missingFor({code,teeth,patient:$('#po-p').value.trim(),shade:$('#po-s').value,notes:$('#po-n').value});
    if(m.length){toast('Still needed: '+m.join(', '));return}
    const c=createCase({practiceId:p.id,dentist:$('#po-d').value,patient:$('#po-p').value.trim(),code,teeth,shade:$('#po-s').value,due:$('#po-due').value,notes:$('#po-n').value,source:'portal',inHand:false});
    charts.po=new Set();render();toast(c.no+' booked — back '+fmtD(c.due));
  }
  if(f.id==='labform'){Object.assign(S.lab,{name:$('#ln').value.trim()||'Your Dental Lab',abn:$('#la').value,acct:$('#lc').value,addr:$('#ld').value});save();$('#dlg').close();render();toast('Settings saved')}
});
render();
</script>
